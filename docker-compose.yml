services:
  bot:
    build: .
    container_name: salon-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://salon:salon@db:5432/salon
      TIMEZONE: Europe/Moscow
      WORK_START_HOUR: "10"
      WORK_END_HOUR: "22"
      SLOT_MINUTES: "30"
      BOOKING_HORIZON_DAYS: "7"
      ADMIN_SECRET: ${ADMIN_SECRET}
    volumes:
      - bot_data:/srv/app/data

  db:
    image: postgres:16-alpine
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  bot_data:
