services:
  bot:
    build: .
    container_name: tropicana-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # внутри контейнера CSV лежит в примонтированной папке
      CSV_FILE: /srv/app/data/bookings.csv
    volumes:
      # файл bookings.csv переживает перезапуск контейнера
      - ./data:/srv/app/data
